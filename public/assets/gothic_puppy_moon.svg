<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <filter id="charcoal-grain-moon" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0.33 0.33 0.33 0 0  0 0 0 0.5 0" result="contrastNoise" />
      <feComposite in="SourceGraphic" in2="contrastNoise" operator="in" result="texturedGraphic" />
      <feBlend in="SourceGraphic" in2="texturedGraphic" mode="multiply" />
    </filter>
    <radialGradient id="moon-glow" cx="50%" cy="32%" r="45%">
      <stop offset="0%" stop-color="#fffdf8" stop-opacity="0.9" />
      <stop offset="40%" stop-color="#ded8cb" stop-opacity="0.4" />
      <stop offset="85%" stop-color="#2a2522" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0c0a09" stop-opacity="0.98" />
    </radialGradient>
  </defs>

  <!-- Antique Aged Paper Base -->
  <rect width="600" height="600" fill="#e8e2d5" />

  <!-- Gothic Full Moon in Charcoal Haze -->
  <circle cx="300" cy="220" r="130" fill="#f5f0e4" stroke="#423b35" stroke-width="2" />
  <circle cx="300" cy="220" r="130" fill="url(#moon-glow)" />

  <!-- Gothic Arch Silhouette Frame -->
  <path d="M 50,560 L 50,240 C 50,110 170,50 300,40 C 430,50 550,110 550,240 L 550,560 Z" 
        fill="none" stroke="#1c1815" stroke-width="5" />
  <path d="M 64,550 L 64,245 C 64,125 176,65 300,56 C 424,65 536,125 536,245 L 536,550 Z" 
        fill="none" stroke="#3b332c" stroke-width="1.5" stroke-dasharray="6,4" />

  <!-- Two Little Puppies Nuzzling in Gothic Silhouette & Charcoal Highlights -->
  <g filter="url(#charcoal-grain-moon)">
    <!-- Ground & Vintage Stone Bench -->
    <path d="M 120,530 Q 300,510 480,530 L 500,560 L 100,560 Z" fill="#151210" />

    <!-- Left Puppy (Snuggling close) -->
    <path d="M 210,510 C 180,480 185,420 220,380 C 235,365 260,350 280,360 C 295,370 290,410 280,460 C 275,490 260,510 210,510 Z" 
          fill="#1c1816" stroke="#080706" stroke-width="2" />
    <!-- Left Puppy Floppy Ear -->
    <path d="M 220,380 C 190,400 180,450 200,480 C 215,485 220,460 225,430 Z" fill="#0d0b0a" />

    <!-- Right Puppy (Nuzzling partner's cheek) -->
    <path d="M 390,510 C 420,480 415,420 380,380 C 365,365 340,350 320,360 C 305,370 310,410 320,460 C 325,490 340,510 390,510 Z" 
          fill="#25201d" stroke="#080706" stroke-width="2" />
    <!-- Right Puppy Floppy Ear -->
    <path d="M 380,380 C 410,400 420,450 400,480 C 385,485 380,460 375,430 Z" fill="#120f0e" />

    <!-- Romantic Heart Shaped Ivy above them -->
    <path d="M 300,320 C 270,280 230,290 240,330 C 250,370 300,410 300,410 C 300,410 350,370 360,330 C 370,290 330,280 300,320 Z" 
          fill="#450e17" opacity="0.85" stroke="#1f050a" stroke-width="2" />

    <!-- Ivy Leaves along arch -->
    <g fill="#1a1e16" stroke="#0a0c09" stroke-width="1">
      <path d="M 120,200 Q 140,190 135,215 Q 115,225 120,200 Z" />
      <path d="M 145,170 Q 165,160 160,185 Q 140,195 145,170 Z" />
      <path d="M 480,200 Q 460,190 465,215 Q 485,225 480,200 Z" />
      <path d="M 455,170 Q 435,160 440,185 Q 460,195 455,170 Z" />
    </g>
  </g>

  <!-- Title Scroll -->
  <g transform="translate(300, 560)">
    <text x="0" y="0" 
          font-family="'Cormorant Garamond', serif" 
          font-size="14" 
          font-style="italic" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#2b241f" 
          text-anchor="middle">
      ETERNAL COMPANIONS • CHARCOAL ETCHING
    </text>
  </g>
</svg>
